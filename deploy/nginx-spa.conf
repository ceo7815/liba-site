# Paste into the xCloud site Nginx config (or equivalent) so React Router
# paths such as /about and /lp/mortgage-insurance do not 404 on refresh.
# /lp/life-discount is served from its own index.html so Facebook reads the LP OG tags.
# Do not cache HTML — hashed JS filenames change on every deploy.
location = /lp/life-discount {
  add_header Cache-Control "no-cache, must-revalidate";
  try_files /lp/life-discount/index.html /index.html;
}
location = /lp/life-discount/ {
  add_header Cache-Control "no-cache, must-revalidate";
  try_files /lp/life-discount/index.html /index.html;
}
location / {
  add_header Cache-Control "no-cache, must-revalidate";
  try_files $uri $uri/ /index.html;
}
