server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML must revalidate after each deploy so hashed JS/CSS filenames update.
  location = /lp/life-discount {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /lp/life-discount/index.html /index.html;
  }
  location = /lp/life-discount/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /lp/life-discount/index.html /index.html;
  }
  location = /lp/life-discount/index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
