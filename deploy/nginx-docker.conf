server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /lp/life-discount {
    try_files /lp/life-discount/index.html /index.html;
  }
  location = /lp/life-discount/ {
    try_files /lp/life-discount/index.html /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
